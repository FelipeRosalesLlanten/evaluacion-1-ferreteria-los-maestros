<!-- CONTENIDO PRINCIPAL DEL CARRITO -->
<div class="container my-5">
    
    <div class="mb-5">
        <h2 class="fw-bold text-uppercase">Mi carrito de compras</h2>
    </div>

    <div class="row g-5">
        
        <!-- COLUMNA IZQUIERDA: LISTA DE PRODUCTOS -->
        <div class="col-lg-8">
            <div id="lista-carrito" class="d-flex flex-column gap-3">
                <!-- JS inyecta los productos aquí -->
            </div>
        </div>

        <!-- COLUMNA DERECHA: RESUMEN Y PAGO -->
        <div class="col-lg-4">
            <div class="p-4 bg-white rounded shadow-sm border border-secondary" style="border-width: 2px !important;">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold text-uppercase m-0">TOTAL:</h5>
                    <span id="total-carrito" class="fw-bold fs-3 text-success">$0</span>
                </div>

                <!-- CUPÓN -->
                <div class="mb-4">
                    <label for="inputCupon" class="form-label text-muted" style="font-size: 0.8rem;">Ingrese el cupón de descuento</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="inputCupon" placeholder="EJ: MAESTRO10">
                        <button class="btn btn-outline-secondary" type="button" id="btnCupon">Aplicar</button>
                    </div>
                </div>

                <hr class="border-secondary mb-4" style="border-width: 2px !important;">

                <!-- BOTÓN DE PAGO -->
                <button id="btn-pagar" class="btn btn-success w-100 text-uppercase fw-bold p-3" style="background-color: #008000 !important; border-color: #008000 !important;">
                    PAGAR
                </button>
            </div>
        </div>

    </div>
</div>
