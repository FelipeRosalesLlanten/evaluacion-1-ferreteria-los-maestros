    <link rel="stylesheet" href="../style.css">
    <title>Contacto</title>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<!-- BARRA DE NAVEGACIÓN SUPERIOR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="home.html">Ferretería Los Maestros</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="nosotros.html">Nosotros</a>

        <a class="nav-link active fw-semibold" href="contacto.html">Contacto</a>
      </div>
    </div>
  </div>
</nav>

<!-- Título centrado -->
<h1 class="text-center my-4"><span>Contacto</span></h1>

<!-- Contenedor con la imagen centrada y un ancho controlado -->
<div class="text-center">
    <img src="../img/Logo.jpg" class="img-fluid" alt="Foto de logo para contacto" style="width: 450px;">
</div>



<!-- Contenedor para darle limpieza y forma -->
 <div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5"> <!-- Esto controla el ancho de tu caja -->
      <!-- Contenedor / Tarjeta de Bootstrap -->
      <div class="card shadow p-4">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Formulario de contacto</h3>
<!-- Caja de inputs contacto -->
<form id="MiFormulario">
<div class="mb-3">
<label for="NombreInput" class="form-label">Nombre completo</label>
<input type="text" class="form-control" id="NombreInput" placeholder="Juan Pérez" required>
</div>


<div class="mb-3">
  <label for="EmailInput" class="form-label">Correo Electronico (Email)</label>
  <input type="email" class="form-control" id="EmailInput" placeholder="Juancitoperez@example.com" required>
</div>


<div class="mb-3">
  <label for="MensajeInput" class="form-label">Mensaje</label>
  <textarea class="form-control" id="MensajeInput" rows="3"></textarea>
</div>
<!-- Div vacío donde mostraremos el mensaje -->
<div id="mensajeAlerta"></div>
<!-- AQUÍ VA EL BOTÓN DE SUBMIT -->
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
</form>
        </div>
      </div>
      <!-- Fin del contenedor -->
    </div>
  </div>
</div>






<script src="../contacto.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
